<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePaste| Local Ops</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d0d0d; color: #00ff41; padding: 2rem; max-width: 900px; margin: 0 auto; }
        h1, h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        button { background: #00ff41; color: #000; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; margin: 5px; font-size: 1rem; }
        button:hover { background: #00cc33; }
        textarea, input { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #444; padding: 1rem; margin-top: 10px; font-family: inherit; }
        .hidden { display: none !important; }
        .panel { background: #111; padding: 20px; border: 1px solid #333; margin-top: 20px; }
        .link-box { background: #222; padding: 15px; border: 1px dashed #555; word-break: break-all; margin-top: 10px; user-select: all; color: #fff;}
        .option-row { margin: 15px 0; background: #222; padding: 10px; border-left: 3px solid #00ff41; }
        
        #chat-window { height: 400px; overflow-y: scroll; border: 1px solid #333; background: #000; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 5px; max-width: 70%; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: #004400; color: #cfc; }
        .msg.them { align-self: flex-start; background: #222; color: #ccc; }
        
        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: #333; color: #888; font-size: 0.8em; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>SecurePaste <span style="font-size:0.5em">v1.0 // Zero-Knowledge</span></h1>    
    <div id="dashboard">
        <p>Select Operation Mode:</p>
        <button onclick="showPasteMode()">NEW SECURE PASTE</button>
        <button onclick="startChatMode()">START SECURE CHAT</button>
    </div>

    <div id="paste-ui" class="panel hidden">
        <h2>Secure Paste</h2>
        <div class="option-row">
            <label><input type="checkbox" id="burn-check"> <strong>BURN AFTER READING</strong></label>
        </div>
        <textarea id="paste-input" rows="10" placeholder="Enter sensitive data..."></textarea>
        <button onclick="savePaste()">ENCRYPT & UPLOAD</button>
        <button onclick="goHome()" style="background:#555; color:#fff">BACK</button>
    </div>

    <div id="view-paste-ui" class="panel hidden">
        <h2>Decrypted Content</h2>
        <div id="burn-warning" class="hidden" style="color:red; margin-bottom:10px;">⚠️ This message has self-destructed.</div>
        <textarea id="paste-output" rows="10" readonly></textarea>
        <button onclick="goHome()">HOME</button>
    </div>

    <div id="chat-ui" class="panel hidden">
        <h2>Secure Chat (Max 2 Users)</h2>
        <div id="chat-link-container" class="hidden">
            <p>Share this link:</p>
            <div id="chat-share-link" class="link-box"></div>
            <p style="color:#888; font-size:0.8em">Waiting for peer...</p>
        </div>
        <div id="chat-window"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="Type encrypted message..." onkeypress="handleChatEnter(event)">
            <button onclick="sendChatMessage()">SEND</button>
        </div>
        <br>
        <div style="display:flex; justify-content: space-between;">
            <button onclick="goHome()" style="background:#555; color:#fff">LEAVE</button>
            <button onclick="nukeChat()" style="background:#f00; color:#fff; border:1px solid #fff;">⚠️ NUKE CHAT</button>
        </div>
    </div>

    <div id="status" style="margin-top:20px; color:yellow;"></div>
    
    <button class="admin-btn" onclick="goToAdmin()">ADMIN ACCESS</button>

    <script src="script.js"></script>
</body>
</html>
